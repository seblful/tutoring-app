# Only the departures from detekt's defaults: the build sets `buildUponDefaultConfig`, so every rule not
# named here runs as detekt ships it. `./gradlew :app:detektGenerateConfig` (after moving this file
# aside) prints the full default set for reference.
#
# Findings that existed when detekt was added live in each module's config/detekt/baseline.xml.

# Formatting belongs to ktlint (see .editorconfig). These would report the same line twice, under two
# rule names and possibly two different limits.
style:
  ForbiddenImport:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/androidHostTest/**', '**/testFixtures/**', '**/testing/src/**', '**/uiTesting/src/**']
    forbiddenImports:
      - 'android.os.Vibrator'
      - 'android.os.VibrationEffect'
      - 'android.view.HapticFeedbackConstants'
      - 'androidx.compose.runtime.collectAsState'
      # The manifest removes WorkManager's foreground service and its permission; a worker calling
      # setForeground would fail at run time. Restore both there before lifting this.
      - 'androidx.work.ForegroundInfo'
      # The design system's wrappers own these (ui/designsystem, a few ui/common parts), each file marked
      # with @file:Suppress("ForbiddenImport"). Features use KlasButton, KlasFab, KlasDivider, FormDialog,
      # ChoiceDialog, ConfirmDialog, AccentCard, SectionCard and KlasSheet — see docs/ui-conventions.md.
      - 'androidx.compose.material3.AlertDialog'
      - 'androidx.compose.material3.BasicAlertDialog'
      - 'androidx.compose.material3.ModalBottomSheet'
      - 'androidx.compose.material3.Card'
      - 'androidx.compose.material3.ElevatedCard'
      - 'androidx.compose.material3.OutlinedCard'
      - 'androidx.compose.material3.FloatingActionButton'
      - 'androidx.compose.material3.ExtendedFloatingActionButton'
      - 'androidx.compose.material3.HorizontalDivider'
      - 'androidx.compose.material3.Button'
      - 'androidx.compose.material3.FilledTonalButton'
      - 'androidx.compose.material3.OutlinedButton'
      - 'androidx.compose.material3.TextButton'
      # NamedIconButton names its glyph when held; a bare IconButton beside it says nothing.
      - 'androidx.compose.material3.IconButton'
  MaxLineLength:
    active: false
  NewLineAtEndOfFile:
    active: false
  WildcardImport:
    active: false
  SpacingAfterPackageAndImports:
    active: false
  ModifierOrder:
    active: false
  TrailingWhitespace:
    active: false
  NoTabs:
    active: false

  # Compose: dp, sp, weights, alphas and durations are layout values read at their call site; a named
  # constant per `16.dp` would move each one away from the only place it means anything.
  MagicNumber:
    ignoreAnnotated: ['Composable']
    # Shared test fixtures follow the same rules as the suites that compile them.
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/iosTest/**', '**/androidHostTest/**', '**/testFixtures/**', '**/testing/src/**', '**/uiTesting/src/**']
  # A @Preview is called by the IDE, never by the code.
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']

naming:
  # Composables are nouns in PascalCase (`StudentCard`), not verbs in camelCase.
  FunctionNaming:
    ignoreAnnotated: ['Composable']
    # Tests read as sentences (backtick names), in every test source set.
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/iosTest/**', '**/androidHostTest/**']
  # Compose's convention names constants in PascalCase (`DisabledAlpha`); the rest of the code keeps
  # SCREAMING_SNAKE (`DEFAULT_LESSON_MINUTES`). Both are in use and both are fine.
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

complexity:
  TooManyFunctions:
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/iosTest/**', '**/androidHostTest/**', '**/testFixtures/**', '**/testing/src/**', '**/uiTesting/src/**']
  # A composable takes `modifier: Modifier = Modifier` and a defaulted parameter per optional slot; those
  # are the API working as intended, not a parameter list that wants a class.
  LongParameterList:
    ignoreDefaultParameters: true
