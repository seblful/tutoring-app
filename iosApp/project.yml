name: Klas
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    # EventKit's full-access request, which the calendar mirror asks for, is iOS 17's.
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: '0.5.1'
    CURRENT_PROJECT_VERSION: '16'
targets:
  Klas:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Klas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Compose draws at the display's full rate on ProMotion phones.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCalendarsFullAccessUsageDescription: >-
          Klas copies your lessons into your calendar so they show beside everything else, when you turn that on.
        NSFaceIDUsageDescription: Klas unlocks with Face ID when you turn the app lock on.
        CFBundleURLTypes:
          - CFBundleURLName: com.seblful.klas
            CFBundleURLSchemes: [klas]
    # The app writes the widgets' snapshot into the group they share (`IosHomeScreen`).
    entitlements:
      path: Sources/Klas.entitlements
      properties:
        com.apple.security.application-groups: [group.com.seblful.klas]
    dependencies:
      - target: KlasWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seblful.klas
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), '-framework', KlasApp]
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [ "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED:-NO}" = "YES" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :ui:embedAndSignAppleFrameworkForXcode --console=plain
  KlasWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Klas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/KlasWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.seblful.klas]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seblful.klas.widgets
        GENERATE_INFOPLIST_FILE: YES
  KlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/LaunchTests.swift]
    dependencies:
      - target: Klas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seblful.klas.uitests
        GENERATE_INFOPLIST_FILE: YES
  # The snapshot the app writes, read as the extension reads it; no app to host it, so no Kotlin build.
  KlasWidgetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/WidgetSnapshotTests.swift
      - Widgets/WidgetSnapshot.swift
      - path: Tests/Fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seblful.klas.widgetstests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Klas:
    build:
      targets:
        Klas: all
        KlasUITests: [test]
        KlasWidgetsTests: [test]
    test:
      targets:
        - name: KlasWidgetsTests
        - name: KlasUITests
          parallelizable: false
