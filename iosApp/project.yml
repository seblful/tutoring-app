name: KlasPilot
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  KlasPilot:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seblful.klas.pilot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), '-framework', KlasShared]
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [ "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED:-NO}" = "YES" ]; then
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --console=plain
  KlasPilotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: KlasPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seblful.klas.pilot.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KlasPilot:
    build:
      targets:
        KlasPilot: all
        KlasPilotUITests: [test]
    test:
      targets:
        - name: KlasPilotUITests
          parallelizable: false
