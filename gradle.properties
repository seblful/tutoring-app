# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the Android operating system.
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official
# Enables namespacing of each library's R class.
android.nonTransitiveRClass=true
# Leave the app and test APKs on the phone after `connectedAndroidTest`, instead of uninstalling both
# when the run finishes. The uninstall silently undoes an `installDebug` — and takes the debug
# database with it — so running a device test would throw away the build being looked at, and the
# seeded students it was being looked at with.
android.injected.androidTest.leaveApksInstalledAfterRun=true
