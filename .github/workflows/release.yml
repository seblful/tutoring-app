name: Release

# A `vX.Y.Z` tag is the whole release procedure: push it and this builds the signed APK and AAB,
# attaches them to a GitHub release, and — once Play publishing is switched on — uploads the AAB to a
# Google Play track with the notes in store/whatsnew. Setup and the first manual upload are in
# docs/releasing.md.
#
# The tag is only a trigger. The version is the one in app/build.gradle.kts, bumped by the
# `chore(release)` commit, so `check` refuses a tag that disagrees with it or that is not on main.
on:
  push:
    tags: ['v*']
  # Re-run a release (or publish it again) from the Actions tab by picking the tag as the ref.
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to (blank = the PLAY_TRACK variable, else internal)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Two runs for one tag would race to create the same GitHub release; a second waits for the first.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.seblful.klas

jobs:
  # Cheap and first, so a wrong tag fails in seconds rather than after the whole suite.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag matches the app version and is on main
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::A release runs on a v* tag, not on $GITHUB_REF"; exit 1 ;;
          esac
          name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name in app/build.gradle.kts"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; fast-forward main to the release commit first"
            exit 1
          fi

      # Play shows these as the release's "What's new", and once releases stop being drafts nobody gets to
      # fix them in the Console first. So each language's file must be filled in, fit Play's 500
      # characters, and have been rewritten since the previous tag — last release's notes again would
      # pass every other check.
      - name: Play release notes are written for this version
        if: vars.PLAY_PUBLISH == 'true'
        env:
          LC_ALL: C.UTF-8 # wc -m counts characters, not the bytes of Cyrillic text
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          for f in store/whatsnew/whatsnew-ru-RU store/whatsnew/whatsnew-en-US; do
            if ! grep -q '[^[:space:]]' "$f" 2>/dev/null; then
              echo "::error file=$f::$f is missing or empty; write this release's notes (docs/releasing.md)"
              exit 1
            fi
            chars=$(wc -m < "$f")
            if [ "$chars" -gt 500 ]; then
              echo "::error file=$f::$f is $chars characters; Play takes at most 500"
              exit 1
            fi
            if [ -n "$prev" ] && git diff --quiet "$prev" "$GITHUB_SHA" -- "$f"; then
              echo "::error file=$f::$f has not changed since $prev; write this release's notes"
              exit 1
            fi
          done

  # The same suite that guards main, run on the tagged commit.
  verify:
    needs: check
    uses: ./.github/workflows/ci.yml

  # The instrumented suite on emulators, alongside `verify`: migrations and the backup round-trip, which
  # only a device can run.
  device-tests:
    needs: check
    uses: ./.github/workflows/device-tests.yml

  build:
    needs: [verify, device-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Pinned to a commit, like the Play upload: this job holds the signing key. Dependabot moves the pin
      # and the version comment together (.github/dependabot.yml).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # The same keystore.properties a developer keeps locally; the build script signs the release
      # only when it exists. The key goes through env, never into the command line or the log.
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret UPLOAD_KEYSTORE_BASE64 is not set; see docs/releasing.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # Play rejects an upload certificate that expires before 22 Oct 2033, and says so only after the
      # whole build; fail here, in a second, instead. -checkend takes seconds from now.
      - name: Upload key outlives Play's 2033 minimum
        env:
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          secs=$(( $(date -d 2033-10-23 +%s) - $(date +%s) ))
          keytool -exportcert -rfc -keystore "$RUNNER_TEMP/upload.jks" -alias "$KEY_ALIAS" \
            -storepass:env STORE_PASSWORD | openssl x509 -noout -enddate -checkend "$secs" ||
            { echo "::error::The upload key expires before 22 Oct 2033; generate a longer-lived one (docs/releasing.md)"; exit 1; }

      - name: Build the signed APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      # Without keystore.properties Gradle still succeeds and leaves an unsigned APK, so a missing
      # signature has to be caught here and not discovered on a phone or in the Console.
      - name: Check the signatures
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          test -f "$apk" || { echo "::error::$apk is missing (unsigned build?)"; exit 1; }
          test -f "$aab" || { echo "::error::$aab is missing"; exit 1; }
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          jarsigner -verify "$aab"
          mkdir dist
          cp "$apk" "$aab" dist/

      - name: Keep the build for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: klas-release
          path: dist/
          retention-days: 30

      # Notes are generated from the commits since the last tag; edit them afterwards with
      # `gh release edit <tag> --notes-file …`. A release made by hand first just gets the files.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/app-release.apk dist/app-release.aab --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/app-release.apk dist/app-release.aab \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

  # Off until the repository variable PLAY_PUBLISH is `true` — Play refuses the API until the first
  # bundle has been uploaded by hand (docs/releasing.md). Separate from `build`, so a Play failure
  # never loses the GitHub release and can be re-run alone.
  publish:
    needs: build
    if: vars.PLAY_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: klas-release
          path: dist

      # Only the release notes; `check` has already made sure they are this version's.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: store/whatsnew
          path: src

      # Pinned to a commit: this action holds the key to the Play account.
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: dist/app-release.aab
          whatsNewDirectory: src/store/whatsnew
          tracks: ${{ inputs.track || vars.PLAY_TRACK || 'internal' }}
          # `draft` until the app's first release has been through Play review; then `completed`.
          status: ${{ vars.PLAY_STATUS || 'completed' }}
