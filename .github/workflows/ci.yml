name: CI

# The unit suite is the project's safety net, and two of its tests — BackupSchemaCoverageTest and
# MappersTest — exist purely to trip when a new table or column is added without being carried
# through the backup or the mappers.
#
# It guards **main**, and nothing else. `develop` is where the work happens: it takes many commits a
# day, most of them mid-thought, and a run on each one is minutes of compute to tell the author
# something they are about to find out anyway. main is what gets tagged and released, so main is
# where a red build has to mean something. Pull requests are checked only where they *target* main,
# for the same reason — that is the merge that matters. `workflow_dispatch` stays so any branch can
# still be run on demand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in progress for the same ref — except on the default branch, where
  # every commit's result is worth keeping.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # JDK 21, matching the Android Studio JBR the project is built with locally.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes the cache. It is the sole branch with a push trigger now, so this is
          # really about the pull-request runs, which read it and must not each save a copy.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # No local.properties here (it is gitignored, holding a machine-specific SDK path); the runner
      # exports ANDROID_HOME, which Gradle falls back to.
      # :domain is plain Kotlin/JVM, so its suite is `test`, not a per-variant `testDebugUnitTest`.
      - name: Unit tests
        run: ./gradlew :domain:test :app:testDebugUnitTest --stacktrace

      - name: Lint
        # lintDebug rather than lint: release lint is switched off in the build script to dodge an
        # AGP 9.2.1 file-locking bug on Windows, so debug is where lint actually runs.
        run: ./gradlew :app:lintDebug --stacktrace

      # The instrumented tests need a device and there is no emulator in this project's workflow, but
      # compiling them still catches the breakage that matters most often: a schema or entity change
      # that leaves a test referring to something that no longer exists.
      - name: Compile instrumented tests
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/test-results/
            domain/build/reports/tests/
            domain/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
