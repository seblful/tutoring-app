name: CI

# The unit suite is the project's safety net, and two of its tests — BackupSchemaCoverageTest and
# MappersTest — exist purely to trip when a new table or column is added without being carried
# through the backup or the mappers.
#
# It guards **main**, and nothing else. `develop` is where the work happens: it takes many commits a
# day, most of them mid-thought, and a run on each one is minutes of compute to tell the author
# something they are about to find out anyway. main is what gets tagged and released, so main is
# where a red build has to mean something. Pull requests are checked where they *target* main, for the
# same reason — that is the merge that matters — and where they target develop, which in practice means
# Dependabot's monthly bump of these actions (.github/dependabot.yml): work on develop is pushed, not
# proposed, and an action bump should not be merged blind. `workflow_dispatch` stays so any branch can
# still be run on demand. `workflow_call` is release.yml: a tag only becomes a release once this same
# suite passes on it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

concurrency:
  # A new push supersedes the run in progress for the same ref — except on the default branch, where
  # every commit's result is worth keeping.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # JDK 21, matching the Android Studio JBR the project is built with locally.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes the cache. It is the sole branch with a push trigger now, so this is
          # really about the pull-request runs, which read it and must not each save a copy.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # No local.properties here (it is gitignored, holding a machine-specific SDK path); the runner
      # exports ANDROID_HOME, which Gradle falls back to.
      # :domain is Kotlin Multiplatform, so its suite is the JVM target's `jvmTest`, not a per-variant
      # Includes unit tests and screenshot comparisons for every @Preview.
      - name: Unit and screenshot tests
        run: ./gradlew :domain:jvmTest :shared:jvmTest :app:verifyRoborazziDebug --stacktrace

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
          retention-days: 14
          if-no-files-found: ignore

      - name: Lint
        # lintDebug rather than lint: release lint is switched off in the build script to dodge an
        # AGP 9.2.1 file-locking bug on Windows, so debug is where lint actually runs.
        run: ./gradlew :app:lintDebug --stacktrace

      # Unqualified task checks every module; each module has its own baseline.
      - name: Formatting (ktlint)
        run: ./gradlew ktlintCheck --stacktrace

      - name: Static analysis (detekt)
        run: ./gradlew detekt --stacktrace

      # Compile device tests and schema checks; running them requires an emulator.
      - name: Compile instrumented tests
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            */build/reports/ktlint/
            */build/reports/detekt/
            app/build/test-results/
            domain/build/reports/tests/
            domain/build/test-results/
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Select an available iOS simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          available = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          devices = [
              device
              for runtime, entries in sorted(available["devices"].items(), reverse=True)
              if ".iOS-" in runtime
              for device in entries
              if device["isAvailable"] and device["name"].startswith("iPhone")
          ]
          if not devices:
              raise SystemExit("No available iPhone simulator on this runner")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("KMP_IOS_SIMULATOR_ID=" + devices[0]["udid"] + "\n")
          PY
      - name: Compile iOS device code and run common tests on iOS
        run: ./gradlew :shared:compileKotlinIosArm64 :domain:iosSimulatorArm64Test :shared:iosSimulatorArm64Test --stacktrace
      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-reports
          path: |
            domain/build/reports/tests/
            domain/build/test-results/
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
