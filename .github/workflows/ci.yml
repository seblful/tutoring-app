name: CI

# Unit tests run for pushes to main, pull requests to main or develop, releases, and manual runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

concurrency:
  # A new push supersedes the run in progress for the same ref — except on the default branch, where
  # every commit's result is worth keeping.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # JDK 21, matching the Android Studio JBR the project is built with locally.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes the cache. It is the sole branch with a push trigger now, so this is
          # really about the pull-request runs, which read it and must not each save a copy.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # No local.properties here (it is gitignored, holding a machine-specific SDK path); the runner
      # exports ANDROID_HOME, which Gradle falls back to.
      # Keep local and CI JVM/Android checks identical through the root verify task.
      - name: Verify repository
        run: ./gradlew verify --stacktrace

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            */build/reports/ktlint/
            */build/reports/detekt/
            app/build/test-results/
            domain/build/reports/tests/
            domain/build/test-results/
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Select an available iOS simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          available = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          devices = [
              device
              for runtime, entries in sorted(available["devices"].items(), reverse=True)
              if ".iOS-" in runtime
              for device in entries
              if device["isAvailable"] and device["name"].startswith("iPhone")
          ]
          if not devices:
              raise SystemExit("No available iPhone simulator on this runner")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("KMP_IOS_SIMULATOR_ID=" + devices[0]["udid"] + "\n")
          PY
      - name: Compile iOS device code and run common tests on iOS
        run: ./gradlew :shared:compileKotlinIosArm64 :domain:iosSimulatorArm64Test :shared:iosSimulatorArm64Test --stacktrace
      - name: Generate the iOS pilot project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec iosApp/project.yml
      - name: Test the iOS host and persistence after relaunch
        run: |
          xcodebuild test -project iosApp/KlasPilot.xcodeproj -scheme KlasPilot \
            -destination "platform=iOS Simulator,id=$KMP_IOS_SIMULATOR_ID" \
            -derivedDataPath iosApp/DerivedData -resultBundlePath iosApp/persistence.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: |
            iosApp/*.xcresult/
            domain/build/reports/tests/
            domain/build/test-results/
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
