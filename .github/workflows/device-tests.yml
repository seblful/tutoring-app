name: Device tests

# Pull requests run the data suite and cold-relaunch probe on both supported test API levels.
# Release calls and manual runs retain the full API 35 suite plus minSdk data checks.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/src/main/**'
      - 'app/src/debug/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - 'shared/**'
      - 'domain/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'scripts/**'
      - '.github/workflows/device-tests.yml'
  workflow_call:
  workflow_dispatch:

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  connected:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One API level failing says nothing about the other; let both finish so a run shows every failure.
      fail-fast: false
      matrix:
        include:
          - api-level: 35
            target: google_apis
            scope: ${{ github.event_name == 'pull_request' && 'data' || 'all' }}
          - api-level: 24
            target: default
            scope: data
    name: API ${{ matrix.api-level }} (${{ matrix.scope }})
    steps:
      # An emulator wants 1.2x its data partition free — 7.4 GB for these images' 6 GB — and a runner
      # has about 6 GB left after the build, so it died at start ("Not enough space to create userdata
      # partition") and the action waited out its boot timeout. Shrinking the partition doesn't work:
      # the action's `disk-size` is appended to config.ini after avdmanager's own value, which wins.
      # So make room instead, from toolchains this job never touches (the Android SDK and the JDK that
      # setup-java installs into /opt/hostedtoolcache stay).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft \
            /opt/az /opt/google /usr/local/julia* /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby
          df -h /

      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node for the relaunch probe
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # Hardware acceleration for the emulator; without it an x86_64 image boots for many minutes, if at all.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Built before the emulator starts, so its boot is not spent waiting on the compiler.
      - name: Build the app and its tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      # Animations stay on: TabReselectFadeTest and ItemMotionTest read fades frame by frame, and the suite
      # is otherwise run on a phone with its animations on. The package filter is a runner argument
      # AndroidJUnitRunner reads; KlasTestRunner passes it through.
      # profile: without one, avdmanager makes a 320dp-wide screen, and the text-fit tests that lay a
      # bar or a tile out at 360dp and 411dp were squeezed to 320 and failed (StatRowAutoSizeTest,
      # BottomBarLabelTest). A Pixel 6 is 411dp wide, the widest any of them asks for.
      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace ${{ matrix.scope == 'data' && '-Pandroid.testInstrumentationRunnerArguments.package=com.seblful.klas.data' || '' }}
            ./gradlew :app:installDebug :app:installDebugAndroidTest --stacktrace
            node scripts/android-relaunch.mjs

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 14
          if-no-files-found: ignore
