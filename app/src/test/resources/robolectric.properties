# Every Robolectric test in the unit suite — screenshot tests today — reads this.
#
# sdk: the app's targetSdk, the runtime behaviour it is written against. Robolectric would otherwise run
# on the highest SDK it knows (37, the compileSdk), whose framework behaviour no release of the app is
# built for; and a pinned SDK is what keeps a screenshot the same from one Robolectric bump to the next.
# Moves with targetSdk in app/build.gradle.kts.
sdk=36

# application: a bare Application, not the manifest's KlasApp. KlasApp is a @HiltAndroidApp whose
# onCreate builds the whole graph, opens the database, installs the crash logger and schedules work — a
# test that wants a Context, a theme or a Room database wants none of that, and must not depend on it.
application=android.app.Application
