[versions]
agp = "9.3.1"
# Kotlin tracks KSP, not the other way round: KSP drives Room + Hilt codegen, and its version's
# major.minor is the Kotlin line it supports (2.3.10 → Kotlin 2.3.x). So Kotlin may move freely
# *within* 2.3 and not past it. Kotlin 2.4.x is out and lint offers it every build; there is still no
# KSP 2.4.x, so taking it would leave the app with no Room DAOs and no Hilt graph. Re-check by listing
# com/google/devtools/ksp/symbol-processing-gradle-plugin on Maven Central — the day a 2.4.x appears,
# both lines move together.
#
# The pin in the root build.gradle.kts must stay equal to `kotlin` here; a check there fails the build
# if it drifts.
kotlin = "2.3.21"
ksp = "2.3.10"
coreKtx = "1.19.0"
# The launch window, backported to minSdk 24. Without it the splash exists only on API 31+, and the
# window the system draws before the first Compose frame is whatever `windowBackground` happens to be.
coreSplashscreen = "1.2.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# androidx.test's core, from the same release as ext-junit 1.3.0 and espresso 3.7.0.
androidxTestCore = "1.7.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
navigationCompose = "2.9.8"
room = "2.8.4"
# The androidx.sqlite Room 2.8.4 is built against: the bundled driver the app opens its database with.
sqlite = "2.6.2"
hilt = "2.60.1"
hiltExt = "1.4.0"
workManager = "2.11.2"
coroutines = "1.11.0"
serialization = "1.11.0"
# Dates and times the domain can share with iOS: `LocalDate`, `YearMonth`, `TimeZone` and the calendar
# arithmetic. `Instant`, `Clock` and `Duration` are the standard library's (`kotlin.time`). 0.7 is where
# `YearMonth` arrived and `Instant` moved to the standard library.
kotlinxDatetime = "0.8.0"
desugar = "2.1.5"
# JVM screenshot tests: Robolectric draws (native graphics), Roborazzi captures and compares, and
# ComposablePreviewScanner finds every @Preview — so a new preview is a new screenshot with no test to
# write. Robolectric 4.17 is the first release that knows SDK 37, this app's compileSdk; the tests
# themselves run on 36 (see src/test/resources/robolectric.properties).
robolectric = "4.17"
roborazzi = "1.76.0"
composablePreviewScanner = "0.9.3"
# Linters, applied to every module from the root build.gradle.kts.
#
# detekt is on the 2.0 alpha line on purpose: 1.23.8 is the last 1.x and was built against Kotlin
# 2.0.21 / AGP 8.8, and it predates AGP 9's built-in Kotlin. 2.0.0-alpha.6 is built against our exact
# AGP (9.3.1) and Gradle (9.6.1). Its own Kotlin (2.4.10) runs in detekt's isolated classpath, not on
# the build's, so it does not fight the 2.3 cap above. Move to 2.0.0 the day it is final; rule ids
# and config keys shifted between the 2.0 alphas, so re-run `detektBaseline` after any bump.
detekt = "2.0.0-alpha.6"
# ktlint-gradle supports AGP 9 built-in Kotlin from 14.1.0. The ktlint engine it runs is pinned
# separately (`ktlint { version }` in build.gradle.kts) rather than left to the plugin's default: a new
# ktlint adds or changes rules, which is a deliberate bump plus `ktlintGenerateBaseline`, not drift.
ktlintGradle = "14.2.0"
ktlint = "1.8.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-compose-preview-scanner-support = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose-preview-scanner-support", version.ref = "roborazzi" }
composable-preview-scanner = { group = "io.github.sergio-sastre.ComposablePreviewScanner", name = "android", version.ref = "composablePreviewScanner" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# Version-managed by the Compose BOM, like material3 itself. Turns the bottom bar into a navigation
# rail past the medium width class, so a tablet is not a phone layout centred in grey.
androidx-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
# SQLite compiled into a JNI library, so the app runs one known SQLite rather than whichever the phone
# carries — the same one Room uses on iOS.
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
# The same SQLite for a JVM test, rather than whichever the host or Robolectric carries. The `-jvm`
# artifact by name: the plain one resolves to the Android variant in an Android module, whose natives
# are built for phones and do not load on the build machine (`app/build.gradle.kts` keeps it off the
# unit tests' classpath for that reason).
androidx-sqlite-bundled-jvm = { group = "androidx.sqlite", name = "sqlite-bundled-jvm", version.ref = "sqlite" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltExt" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltExt" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltExt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltExt" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workManager" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# The `:domain` module: Kotlin Multiplatform, so no Android plugin to compile it. Same `kotlin` as the
# app's built-in Kotlin — it is the one KGP pinned in the root build.gradle.kts.
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
