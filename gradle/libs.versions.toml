[versions]
# SDK levels every module builds against. `targetSdk` also moves both `robolectric.properties` (app and ui tests).
compileSdk = "37"
minSdk = "24"
targetSdk = "36"
agp = "9.3.1"
# Kotlin and KSP version independently: since 2.3.0 a KSP release is not tied to one Kotlin line (its
# number no longer starts with Kotlin's), and 2.3.10 is the first to work with Kotlin 2.4. KSP still
# drives Room's codegen, so a Kotlin bump is checked by building the DAOs, not by matching numbers.
# `metro` is the one that does follow the compiler: a compiler plugin supports a range of Kotlin
# versions, listed in Metro's docs/compatibility.md — check it before raising either.
#
# The pin in the root build.gradle.kts must stay equal to `kotlin` here; a check there fails the build
# if it drifts.
kotlin = "2.4.21"
ksp = "2.3.12"
coreKtx = "1.19.0"
# The launch window, backported to minSdk 24. Without it the splash exists only on API 31+, and the
# window the system draws before the first Compose frame is whatever `windowBackground` happens to be.
coreSplashscreen = "1.2.0"
# The app lock's prompt: biometrics or the screen lock on every API level from 24. The last stable release —
# 1.4 is still alpha — and it wants a FragmentActivity.
biometric = "1.1.0"
# Google Play Billing: sells Klas Pro (the subscription and the one-time purchase) on Android only.
playBilling = "9.1.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# androidx.test's core, from the same release as ext-junit 1.3.0 and espresso 3.7.0.
androidxTestCore = "1.7.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
# Compose 1.12 (foundation, ui, runtime): the first stable line with the Styles API (`foundation.style`), still
# @ExperimentalFoundationStyleApi — the app module opts in. material3 stays 1.4.0.
composeBom = "2026.09.00"
navigation3 = "1.2.0"
# Back handling under Navigation 3's own, declared because the app's in-screen back guards call
# `NavigationBackHandler` directly. Ahead of the 1.1.1 navigation3 1.2.0 asks for, which it raises: the
# artifacts are one atomic group, so Navigation 3 runs on this version too.
navigationEvent = "1.2.0"
# Material's list-detail scene for Navigation 3. Ahead of the Compose BOM's adaptive 1.2.0, which it raises
# to its own 1.3.0: the BOM does not manage this artifact yet.
materialAdaptiveNavigation3 = "1.3.0"
# Compose Multiplatform: the shared UI in `:ui`, for Android and iOS. On Android each artifact resolves to the
# androidx one of the same Compose line (1.12.2 here, a patch past the BOM's 1.12.1). JetBrains versions
# material3 separately: its 1.9.0 *is* androidx material3 1.4.0, and adaptive 1.3.0 is androidx's 1.3.0.
# Navigation 3, lifecycle and savedstate share androidx's numbers; navigationevent's iOS build lags at 1.1.0,
# and on Android the androidx 1.2.0 above wins.
composeMultiplatform = "1.12.2"
composeMaterial3 = "1.9.0"
composeAdaptive = "1.3.0"
jbNavigationEvent = "1.1.0"
jbSavedstate = "1.4.0"
room = "2.8.4"
# The androidx.sqlite Room 2.8.4 is built against: the bundled driver the app opens its database with.
sqlite = "2.6.2"
# Compile-time DI as a Kotlin compiler plugin, so it runs in common code (iOS too) and needs no KSP.
# A compiler plugin follows the compiler: check its CHANGELOG supports `kotlin` before raising either.
metro = "1.4.5"
workManager = "2.11.2"
# Home-screen widgets (`widget/`). 1.3 is alpha and only adds snap scrolling, which neither widget uses.
glance = "1.2.0"
coroutines = "1.11.0"
serialization = "1.11.0"
# Dates and times the domain can share with iOS: `LocalDate`, `YearMonth`, `TimeZone` and the calendar
# arithmetic. `Instant`, `Clock` and `Duration` are the standard library's (`kotlin.time`). 0.7 is where
# `YearMonth` arrived and `Instant` moved to the standard library.
kotlinxDatetime = "0.8.0"
desugar = "2.1.5"
# JVM screenshot tests: Robolectric draws (native graphics), Roborazzi captures and compares, and
# ComposablePreviewScanner finds every @Preview — so a new preview is a new screenshot with no test to
# write. Robolectric 4.17 is the first release that knows SDK 37, this app's compileSdk; the tests
# themselves run on 36 (see src/test/resources/robolectric.properties).
robolectric = "4.17"
roborazzi = "1.76.0"
# The app's baseline profile: the Gradle plugin and Macrobenchmark that collect it (`:baselineprofile`), and
# the installer that applies it to an APK installed from outside Play. 1.5.0 is the first plugin that runs on
# AGP 9 without `android.newDsl=false`.
benchmark = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"
composablePreviewScanner = "0.9.3"
# Linters, applied to every module from the root build.gradle.kts.
#
# detekt is on the 2.0 alpha line on purpose: 1.23.8 is the last 1.x and was built against Kotlin
# 2.0.21 / AGP 8.8, and it predates AGP 9's built-in Kotlin. 2.0.0-alpha.6 is built against our exact
# AGP (9.3.1) and Gradle (9.6.1). Its own Kotlin (2.4.10) runs in detekt's isolated classpath, not on
# the build's. Move to 2.0.0 the day it is final; rule ids
# and config keys shifted between the 2.0 alphas, so re-run `detektBaseline` after any bump.
detekt = "2.0.0-alpha.6"
# ktlint-gradle supports AGP 9 built-in Kotlin from 14.1.0. The ktlint engine it runs is pinned
# separately (`ktlint { version }` in build.gradle.kts) rather than left to the plugin's default: a new
# ktlint adds or changes rules, which is a deliberate bump plus `ktlintGenerateBaseline`, not drift.
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
# Coverage agent and report, pinned like the linters: Gradle's bundled default moves with Gradle.
jacoco = "0.8.15"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
play-billing = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "playBilling" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-compose-preview-scanner-support = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose-preview-scanner-support", version.ref = "roborazzi" }
composable-preview-scanner = { group = "io.github.sergio-sastre.ComposablePreviewScanner", name = "android", version.ref = "composablePreviewScanner" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# Version-managed by the Compose BOM, like material3 itself. Puts the tabs in a navigation rail past
# the medium width class, so a tablet is not a phone layout centred in grey (a phone's bar is the app's own).
androidx-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }

androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-material3-adaptive-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "materialAdaptiveNavigation3" }
androidx-navigationevent-compose = { group = "androidx.navigationevent", name = "navigationevent-compose", version.ref = "navigationEvent" }

compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
compose-ui-test = { group = "org.jetbrains.compose.ui", name = "ui-test", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMaterial3" }
compose-material3-adaptive-navigation-suite = { group = "org.jetbrains.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "composeMaterial3" }
compose-material3-adaptive-navigation3 = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "composeAdaptive" }
jb-navigation3-ui = { group = "org.jetbrains.androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
jb-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
jb-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
jb-lifecycle-viewmodel-navigation3 = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
jb-navigationevent-compose = { group = "org.jetbrains.androidx.navigationevent", name = "navigationevent-compose", version.ref = "jbNavigationEvent" }
jb-savedstate-compose = { group = "org.jetbrains.androidx.savedstate", name = "savedstate-compose", version.ref = "jbSavedstate" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
# SQLite compiled into a JNI library, so the app runs one known SQLite rather than whichever the phone
# carries — the same one Room uses on iOS.
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
# The same SQLite for a JVM test, rather than whichever the host or Robolectric carries. The `-jvm`
# artifact by name: the plain one resolves to the Android variant in an Android module, whose natives
# are built for phones and do not load on the build machine (`app/build.gradle.kts` keeps it off the
# unit tests' classpath for that reason).
androidx-sqlite-bundled-jvm = { group = "androidx.sqlite", name = "sqlite-bundled-jvm", version.ref = "sqlite" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

# `metroViewModel()` and the ViewModel multibindings behind it; brings `metrox-viewmodel` with it.
metrox-viewmodel-compose = { group = "dev.zacsweers.metro", name = "metrox-viewmodel-compose", version.ref = "metro" }

androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
# The app's own colour schemes as widget colours (`ColorProviders`), so a widget wears the app's palette.
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
androidx-glance-preview = { group = "androidx.glance", name = "glance-preview", version.ref = "glance" }
androidx-glance-appwidget-preview = { group = "androidx.glance", name = "glance-appwidget-preview", version.ref = "glance" }
androidx-glance-appwidget-testing = { group = "androidx.glance", name = "glance-appwidget-testing", version.ref = "glance" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workManager" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
# The `:domain` module: Kotlin Multiplatform, so no Android plugin to compile it. Same `kotlin` as the
# app's built-in Kotlin — it is the one KGP pinned in the root build.gradle.kts.
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
